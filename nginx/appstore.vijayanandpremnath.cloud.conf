# nginx/appstore.vijayanandpremnath.cloud.conf
# Host-level nginx site config for the shared VPS (46.202.160.63).
# Copy to /etc/nginx/sites-available/appstore.vijayanandpremnath.cloud
# then symlink into sites-enabled and run certbot --nginx -d appstore.vijayanandpremnath.cloud
#
# Proxies to the wlstore containers, which are bound to 127.0.0.1 only
# (see docker-compose.prod.yml): backend on 18092, admin-portal on 18093.

server {
    listen 80;
    server_name appstore.vijayanandpremnath.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name appstore.vijayanandpremnath.cloud;

    # certbot --nginx will fill in ssl_certificate / ssl_certificate_key here

    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # APK binary downloads — proxies to MinIO's S3 API so presigned URLs
    # issued by the backend (bucket "wl-apks") are reachable from the internet.
    location /wl-apks/ {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:18093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
