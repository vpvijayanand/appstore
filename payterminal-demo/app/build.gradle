plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.worldline.payterminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.worldline.payterminal"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "3.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
