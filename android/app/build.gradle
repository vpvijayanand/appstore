plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.worldline.wlstore'
    compileSdk 34

    defaultConfig {
        applicationId "com.worldline.wlstore"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        // Set your backend API URL here
        buildConfigField "String", "API_BASE_URL", "\"https://appstore.vijayanandpremnath.cloud/api\""
        buildConfigField "String", "APP_VERSION", "\"1.1.0\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"https://appstore.vijayanandpremnath.cloud/api\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Location (GPS)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Preferences (Terminal ID storage)
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.security:security-crypto:1.0.0'

    // Tab layout + ViewPager
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
